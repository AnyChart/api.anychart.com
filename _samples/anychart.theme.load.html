<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.theme.load"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; justify-content: center; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <button onclick="loadCoffeeTheme()">Load the coffee theme</button>
</div>
<div id="container"></div>
<script>
    var chart;

    anychart.onDocumentReady(function () {
        createChart();
    });

    // fetch the theme module and apply it once it registers
    function loadCoffeeTheme() {
        anychart.theme.load('coffee').then(createChart);
    }

    function createChart() {
        if (chart) chart.dispose();

        chart = anychart.column();
        chart.column([21.2, 32.5, 21.3, 44.5, 21, 35.2, 67.7]);
        chart.column([21, 97, 56, 24, 27, 30, 27]);
        chart.column([38, 124, 75, 40, 40, 50, 39]);

        chart.container('container');
        chart.draw();
    }
</script>
</body>
</html>
