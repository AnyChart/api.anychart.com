<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.a11yHighContrast"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; justify-content: center; align-items: center; gap: 14px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <label><input type="checkbox" onchange="highContrast(this.checked)"> High contrast</label>
</div>
<div id="container"></div>
<script>
    var chart;

    anychart.onDocumentReady(function () {
        createChart();
    });

    // switch the high-contrast mode and create the chart again
    function highContrast(enabled) {
        if (enabled) {
            // the theme file is loaded on demand, so wait for the promise
            anychart.a11yHighContrast(true).then(createChart);
        } else {
            anychart.a11yHighContrast(false);
            createChart();
        }
    }

    function createChart() {
        // a chart keeps its colors until it is created again
        if (chart) chart.dispose();

        chart = anychart.column();
        chart.column([21.2, 32.5, 21.3, 44.5, 21, 35.2, 67.7]);
        chart.column([21, 97, 56, 24, 27, 30, 27]);
        chart.column([38, 124, 75, 40, 40, 50, 39]);

        // show the state of the mode in the title
        chart.title('High-contrast mode: ' + (anychart.a11yHighContrast() ? 'on' : 'off'));

        chart.container('container');
        chart.draw();
    }
</script>
</body>
</html>
