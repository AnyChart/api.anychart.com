<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.charts.OrgChart.goToNode"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-org.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        var chart = anychart.orgChart([
            {id: 1, name: 'CEO'},
            {id: 2, parent: 1, name: 'CTO'},
            {id: 3, parent: 1, name: 'CFO'},
            {id: 4, parent: 2, name: 'Lead Engineer'},
            {id: 5, parent: 2, name: 'QA Lead'}
        ], 'as-table');

        chart.container('container');
        chart.draw();

        // Collapse the CTO branch, then show the QA Lead card: the branch expands,
        // the view zooms and centers on the card, and the card is selected.
        chart.collapse(2);
        chart.goToNode(5);
    });
</script>
</body>
</html>
