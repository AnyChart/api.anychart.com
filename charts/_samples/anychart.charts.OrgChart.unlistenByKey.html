<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.charts.OrgChart.unlistenByKey"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-org-chart.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        var stage = anychart.graphics.create('container');

        var chart = anychart.orgChart([
            {id: 1, name: 'CEO'},
            {id: 2, parent: 1, name: 'CTO'},
            {id: 3, parent: 1, name: 'CFO'},
            {id: 4, parent: 2, name: 'Lead Engineer'}
        ]);
        chart.title('Click on the chart. You have 3 clicks');
        chart.listen('click', customListener);

        var listenKey = chart.listen('click', customListener);

        var counter = 3;

        function customListener(e) {
            counter--;
            chart.title('Click on the chart. You have ' + counter + ' clicks');
            if (counter === 0) {
                // Removes event listener by the key
                chart.unlistenByKey(listenKey);
                chart.title('You have no more clicks');
            }
        }

        chart.container(stage);
        chart.draw();
    });
</script>
</body>
</html>
