<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.charts.OrgChart.contextMenu set asObj"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-org-chart.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        // To change the way how context menu looks you need to change CSS.
        // By default CSS from AnyChart CDN is used: https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css
        // Download it, alter, upload to your server and link from your pages to change the look.

        var chart = anychart.orgChart([
            {id: 1, name: 'CEO'},
            {id: 2, parent: 1, name: 'CTO'},
            {id: 3, parent: 1, name: 'CFO'},
            {id: 4, parent: 2, name: 'Lead Engineer'}
        ], 'as-table');

        // Set context menu setting.
        chart.contextMenu({enabled: false});

        chart.title('Set context menu parameter as an object. Context menu is disabled using object in this sample');
        chart.container('container');
        chart.draw();
    });
</script>
</body>
</html>
