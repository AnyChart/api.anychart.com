<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.charts.DependencyWheel.dropOverlappedLabels set"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-dependency-wheel.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        // One heavy edge makes two big nodes, the rest of the nodes get tiny,
        // closely-packed segments whose labels overlap by default.
        var chart = anychart.dependencyWheel([
            {from: 'Alpha', to: 'Beta', weight: 50},
            {from: 'Beta', to: 'Gamma', weight: 1},
            {from: 'Gamma', to: 'Delta', weight: 1},
            {from: 'Delta', to: 'Epsilon', weight: 1},
            {from: 'Epsilon', to: 'Zeta', weight: 1},
            {from: 'Zeta', to: 'Eta', weight: 1},
            {from: 'Eta', to: 'Theta', weight: 1},
            {from: 'Theta', to: 'Alpha', weight: 1}
        ]);

        // Force all node labels to show, even the overlapping ones.
        chart.dropOverlappedLabels(false);

        chart.title('dropOverlappedLabels: false (all labels forced to show)');
        chart.container('container');
        chart.draw();
    });
</script>
</body>
</html>
