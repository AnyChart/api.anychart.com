<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.charts.ArcDiagram.getUnplacedNodeLabels"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-arc.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        var data = [];
        for (var i = 0; i < 12; i++) {
            data.push({from: 'Node Name ' + i, to: 'Node Name ' + ((i + 1) % 12), weight: 1 + i});
        }
        var chart = anychart.arcDiagram(data);

        // A short leader line budget makes labels that need a longer one get dropped instead of drawn.
        chart.node().labels().connectorMaxLength(2);

        chart.container('container');
        chart.draw();

        // Show the text of the node labels the chart could not place.
        chart.title('Unplaced labels: ' + chart.getUnplacedNodeLabels().length);
    });
</script>
</body>
</html>
