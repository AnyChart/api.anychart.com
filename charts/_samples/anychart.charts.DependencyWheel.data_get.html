<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.charts.DependencyWheel.data get"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-dependency-wheel.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        var chart = anychart.dependencyWheel([
            {from: 'A', to: 'B', weight: 5},
            {from: 'A', to: 'C', weight: 3},
            {from: 'B', to: 'D', weight: 4},
            {from: 'C', to: 'D', weight: 2}
        ]);

        // Get the chart data view and show the row count.
        var dataView = chart.data();
        chart.title('data() returns a view with ' + dataView.getRowsCount() + ' rows');

        chart.container('container');
        chart.draw();
    });
</script>
</body>
</html>
