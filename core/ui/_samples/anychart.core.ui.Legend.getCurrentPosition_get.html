<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.ui.Legend.getCurrentPosition get"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/8.13.0/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.13.0/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.13.0/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/8.13.0/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        // create marker chart
        var chart = anychart.marker();

        // add marker series
        var series1 = chart.marker([[1, 1], [2, 4]]);
        series1.name("Thing 1");
        var series2 = chart.marker([[1, 2], [2, 5]]);
        series2.name("Thing 2");
        var series3 = chart.marker([[1, 3], [2, 6]]);
        series3.name("Thing 2");

        // configure legend
        var legend = chart.legend();
        legend.enabled(true);
        legend.drag(true);
        legend.padding(10);
        legend.positionMode("inside");
        legend.background().enabled(true);
        legend.background().stroke("#000000");
        
        // set a title
        chart.title("Drag the legend to see the new position coordinates are");

        // event listener for dragging the legend
        legend.listen("dragEnd", saveLegendPosition);

        // set the event listener for resizing the legend
        function saveLegendPosition() {
            // get current pixel bounds
            var position2 = legend.getCurrentPosition();

            // beautify the bounds to display in the title
            var x = Math.round(position2.x)
            var y = Math.round(position2.y)

            // update the title
            chart.title("Legend new position coordinates are " + x + " and " + y);
        }

        // draw chart in container
        chart.container("container");
        chart.draw();
    });
</script>
</body>
</html>
