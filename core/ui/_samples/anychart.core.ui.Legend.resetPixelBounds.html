<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.ui.Legend.resetPixelBounds"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        // create marker chart
        var chart = anychart.marker();

        // add marker series
        var series1 = chart.marker([[1, 1], [2, 4]]);
        series1.name("Thing 1");
        var series2 = chart.marker([[1, 2], [2, 5]]);
        series2.name("Thing 2");
        var series3 = chart.marker([[1, 3], [2, 6]]);
        series3.name("Thing 2");

        // configure legend
        var legend = chart.legend();
        legend.enabled(true);
        legend.drag(true);
        legend.padding(10);
        legend.positionMode("inside");
        legend.background().enabled(true);
        legend.background().stroke("#000000");

        // set a title
        chart.title("Drag the legend to see set the legend current pixel bounds reset");
        
        // Event listener for dragging the legend
        legend.listen("dragEnd", resetLegendPosition);

        function resetLegendPosition() {
            // reset the legend current pixel bounds
            legend.resetPixelBounds();
        }

        // draw chart in container
        chart.container("container");
        chart.draw();

    });
</script>
</body>
</html>
