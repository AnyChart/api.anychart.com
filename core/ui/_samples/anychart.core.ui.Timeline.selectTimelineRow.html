<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.ui.Timeline.selectTimelineRow"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/8.14.0/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.14.0/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.14.0/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/8.14.0/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        button {
            margin: 10px 0 0 10px;
        }
    </style>
</head>
<body>
<button onclick="hide();">Hide tooltip</button>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
    // create data
    var data = [
        {
        id: "1",
        name: "Resource 1",
        periods: [
            { id: "1_1", start: "2018-01-05", end: "2018-01-25" },
            {
            id: "1_2",
            start: "2018-01-28",
            end: "2018-02-22",
            },
            {
            id: "1_3",
            start: "2018-03-01",
            end: "2018-03-25",
            },
        ],
        },
        {
        id: "2",
        name: "Resource 2",
        periods: [
            { id: "2_1", start: "2018-01-07", end: "2018-02-15" },
            {
            id: "2_2",
            start: "2018-03-05",
            end: "2018-03-18",
            },
        ],
        },
        {
        id: "3",
        name: "Resource 3",
        periods: [
            {
            id: "3_1",
            start: "2018-01-04",
            end: "2018-02-20",
            },
            { id: "3_2", start: "2018-03-01", end: "2018-03-20" },
        ],
        },
    ];

    // create a data tree
    var treeData = anychart.data.tree(data, "as-tree");

    // create a chart
    var chart = anychart.ganttResource();

    // set the data
    chart.data(treeData);

    // set a period or an item to select
    var item = treeData.search('id', '1');

    // select the period or the item
    chart.getTimeline().selectTimelineRow(item, 1);

    // set the container id
    chart.container("container");

    // initiate drawing the chart
    chart.draw();

    // fit elements to the width of the timeline
    chart.fitAll();
    });
</script>
</body>
</html>
