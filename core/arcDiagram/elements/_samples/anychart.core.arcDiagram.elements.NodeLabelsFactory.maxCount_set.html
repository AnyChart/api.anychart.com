<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.arcDiagram.elements.NodeLabelsFactory.maxCount set"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-arc-diagram.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        // Many nodes with long names, so it is clear only the heaviest ones keep a label.
        var data = [];
        var count = 150;
        for (var i = 0; i < count; i++) {
            data.push({
                from: 'Node number ' + i + ' with a very long name',
                to: 'Node number ' + ((i + 1) % count) + ' with a very long name',
                weight: 1
            });
        }
        var chart = anychart.arcDiagram(data);

        // Only the 5 heaviest node labels compete for a lane; the rest are cut before layout runs.
        chart.node().labels().maxCount(5);

        chart.container('container');
        chart.draw();

        chart.title('Unplaced labels: ' + chart.getUnplacedNodeLabels().length);
    });
</script>
</body>
</html>
