<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.orgChart.Level.connectorMiddleMarker set"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-org.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css"
          href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        var chart = anychart.orgChart([
            {id: 1, name: 'CEO'},
            {id: 2, parent: 1, name: 'CTO'},
            {id: 3, parent: 1, name: 'CFO'},
            {id: 4, parent: 2, name: 'Lead Engineer'},
            {id: 5, parent: 2, name: 'QA Lead'}
        ], 'as-table');

        // Draw middle markers on all connectors.
        chart.connectorMiddleMarker({enabled: true});
        // Make the middle markers of the connectors into the second-level cards bigger and blue.
        chart.level(1).connectorMiddleMarker({type: 'diamond', size: 12, fill: '#1976d2'});

        chart.container('container');
        chart.draw();
    });
</script>
</body>
</html>
