<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.cartesian.series.Lollipop.clip_set"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        var chart = anychart.lollipop();

        // Raise the scale minimum so the lowest point falls below the plot area.
        chart.yScale().minimum(11);

        var series = chart.lollipop([
            {x: 'January', value: 12},
            {x: 'February', value: 15},
            {x: 'March', value: 11},
            {x: 'April', value: 17},
            {x: 'May', value: 10}
        ]);

        // Disable clip so the May point (below the minimum) stays visible.
        series.clip(false);

        chart.title('Clip disabled: point below the axis stays visible');
        chart.container('container');
        chart.draw();
    });
</script>
</body>
</html>
