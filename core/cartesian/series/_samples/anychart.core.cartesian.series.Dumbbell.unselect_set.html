<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.cartesian.series.Dumbbell.unselect_set"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        var chart = anychart.dumbbell();

        // This series keeps its selection - its points stay highlighted.
        var keptSeries = chart.dumbbell([
            {x: 'January', low: 3, high: 12},
            {x: 'February', low: 4, high: 15},
            {x: 'March', low: 5, high: 11},
            {x: 'April', low: 6, high: 17},
            {x: 'May', low: 4, high: 10}
        ]);
        keptSeries.name('Selection kept');
        keptSeries.xPointPosition(0.35);
        keptSeries.selected().markers().enabled(true).size(14).type('star5').fill('#ff6600');
        keptSeries.select([0, 1, 2, 3, 4]);

        // This series is fully deselected with unselect().
        var clearedSeries = chart.dumbbell([
            {x: 'January', low: 3, high: 12},
            {x: 'February', low: 4, high: 15},
            {x: 'March', low: 5, high: 11},
            {x: 'April', low: 6, high: 17},
            {x: 'May', low: 4, high: 10}
        ]);
        clearedSeries.name('Cleared with unselect()');
        clearedSeries.xPointPosition(0.65);
        clearedSeries.selected().markers().enabled(true).size(14).type('star5').fill('#ff6600');
        clearedSeries.select([0, 1, 2, 3, 4]);
        clearedSeries.unselect();

        chart.legend(true);
        chart.title('unselect() cleared the highlighted selection');
        chart.container('container');
        chart.draw();
    });
</script>
</body>
</html>
