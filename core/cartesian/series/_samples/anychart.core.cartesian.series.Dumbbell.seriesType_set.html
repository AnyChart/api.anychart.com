<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.cartesian.series.Dumbbell.seriesType_set"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        button {
            margin: 10px 0 0 10px;
        }
    </style>
</head>
<body>
<button onclick="column()">Switch to the column series</button>
<button onclick="area()">Switch to the area series</button>
<button onclick="line()">Switch to the line series</button>
<div id="container"></div>
<script>
    var chart, series;
    anychart.onDocumentReady(function () {
        chart = anychart.dumbbell();

        series = chart.dumbbell([
            {x: 'January', low: 3, high: 12},
            {x: 'February', low: 4, high: 15},
            {x: 'March', low: 5, high: 11},
            {x: 'April', low: 6, high: 17},
            {x: 'May', low: 4, high: 10}
        ]);

        chart.title('Switch the series type');
        chart.width('100%').height('95%');
        chart.container('container');
        chart.draw();

    });

        function column() {

            // Switch the series type.
            series.seriesType('column');
        }

       function area() {

            // Switch the series type.
            series.seriesType('area');
        }

        function line() {

            // Switch the series type.
            series.seriesType('line');
        }
</script>
</body>
</html>
