<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.cartesian.series.Dumbbell.colorScale_set"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-cartesian.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        var chart = anychart.dumbbell();

        var series = chart.dumbbell([
            {x: 'January', low: 3, high: 12},
            {x: 'February', low: 4, high: 15},
            {x: 'March', low: 5, high: 11},
            {x: 'April', low: 6, high: 17},
            {x: 'May', low: 4, high: 10}
        ]);

        var colorScale = anychart.scales.ordinalColor();
        colorScale.ranges([
            {
                less: 4,
                color: '#90caf9'
            },
            {
                from: 4,
                to: 8,
                color: '#aed581'
            },
            {
                greater: 8,
                color: '#ffab91'
            }
        ]);

        // Set color scale settings.
        series.colorScale(colorScale);

        series.stroke(function () {
            return anychart.color.setThickness(this.sourceColor, 4);
        });

        chart.title('Set series color scale');
        chart.container('container');
        chart.draw();
    });
</script>
</body>
</html>
