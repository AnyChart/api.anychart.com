<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.cartesian.series.Lollipop.zIndex_set"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        var chart = anychart.lollipop();

        // Two series with the same data are placed at the same position so they fully overlap.
        var blue = chart.lollipop([
            {x: 'January', value: 12},
            {x: 'February', value: 15},
            {x: 'March', value: 11},
            {x: 'April', value: 17},
            {x: 'May', value: 10}
        ]);
        blue.normal().stroke('#1976d2', 3);
        blue.markers().enabled(true).size(13).fill('#1976d2');
        blue.xPointPosition(0.5);

        var orange = chart.lollipop([
            {x: 'January', value: 12},
            {x: 'February', value: 15},
            {x: 'March', value: 11},
            {x: 'April', value: 17},
            {x: 'May', value: 10}
        ]);
        orange.normal().stroke('#ff6600', 3);
        orange.markers().enabled(true).size(13).fill('#ff6600');
        orange.xPointPosition(0.5);

        // Orange is drawn second, so by default it covers blue.
        // Raising the blue series' zIndex brings it in front instead.
        blue.zIndex(100);

        chart.title('Blue series raised above orange via zIndex');
        chart.container('container');
        chart.draw();
    });
</script>
</body>
</html>
