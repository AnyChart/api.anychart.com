<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.cartesian.series.Dumbbell.rendering_get"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        var chart = anychart.dumbbell();

        var series = chart.dumbbell([
            {x: 'January', low: 3, high: 12},
            {x: 'February', low: 4, high: 15},
            {x: 'March', low: 5, high: 11},
            {x: 'April', low: 6, high: 17},
            {x: 'May', low: 4, high: 10}
        ]);

        series.rendering().point(drawer);

        // Get the rendering settings.
        var rendering = series.rendering();

        chart.title('Get rendering settings');
        chart.container('container');
        chart.draw();
    });

    function drawer() {
        if (this.missing) {
            return;
        }
        var shapes = this.getShapesGroup(this.pointState);
        var w = 6;
        // Connector line between low and high.
        shapes['stroke'].moveTo(this.x, this.low).lineTo(this.x, this.high);
        // Diamond markers at the endpoints.
        shapes['high'].moveTo(this.x - w, this.high).lineTo(this.x, this.high - w).lineTo(this.x + w, this.high).lineTo(this.x, this.high + w).close();
        shapes['low'].moveTo(this.x - w, this.low).lineTo(this.x, this.low - w).lineTo(this.x + w, this.low).lineTo(this.x, this.low + w).close();
    }
</script>
</body>
</html>
