<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.graph.elements.Interactivity.boundsMode_set"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-graph.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css"
          href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
  anychart.onDocumentLoad(function() {
    var data = {
      'nodes': [
        {'id': 'A'},
        {'id': 'B'},
        {'id': 'C'},
        {'id': 'D'},
        {'id': 'E'}
      ],
      'edges': [
        {'from': 'A', 'to': 'B'},
        {'from': 'A', 'to': 'C'},
        {'from': 'A', 'to': 'D'},
        {'from': 'D', 'to': 'C'},
        {'from': 'E', 'to': 'D'}
      ]
    };

    var stage = acgraph.create('container');

    var chart1 = anychart.graph(data);
    chart1.title().enabled(true).text('Bounds mode: free - drag the graph anywhere');
    chart1.bounds(0, 0, '50%', '100%');

    // let the graph be dragged out of the chart area
    chart1.interactivity().boundsMode('free');

    var chart2 = anychart.graph(data);
    chart2.title().enabled(true).text('Bounds mode: contain - the graph stays inside');
    chart2.bounds('50%', 0, '50%', '100%');

    // keep the graph inside the chart area while dragging
    chart2.interactivity().boundsMode('contain');

    chart1.container(stage).draw();
    chart2.container(stage).draw();
  });
</script>
</body>
</html>
