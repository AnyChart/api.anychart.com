<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.StateSettings.lowLabels set"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        // Create a column chart and a range column series.
        var chart = anychart.column();
        var series = chart.rangeColumn([
            ['Jan', 12, 21],
            ['Feb', 14, 25],
            ['Mar', 10, 19],
            ['Apr', 16, 28]
        ]);

        // Show a label at each end of every point.
        series.labels().enabled(true).position('rangeMode');

        var state = series.normal();

        // Set the low-end labels; the high-end labels keep the labels() settings.
        state.lowLabels({fontColor: '#1565C0', fontWeight: 600, fontSize: 14});

        chart.title('Set state low-end labels');
        chart.container('container');
        chart.draw();
    });
</script>
</body>
</html>
