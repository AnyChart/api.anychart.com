<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.stock.Plot.dumbbell"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-stock.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        // Create a data table: date, low, high.
        var dataTable = anychart.data.table();
        dataTable.addData([
            [Date.UTC(2024, 0, 1), 102, 118],
            [Date.UTC(2024, 0, 2), 106, 121],
            [Date.UTC(2024, 0, 3), 99, 115],
            [Date.UTC(2024, 0, 4), 104, 124],
            [Date.UTC(2024, 0, 5), 110, 127]
        ]);

        // Map the low and high values.
        var mapping = dataTable.mapAs({low: 1, high: 2});

        var chart = anychart.stock();

        var plot = chart.plot();

        // Adds Dumbbell series.
        plot.dumbbell(mapping);

        chart.title('Add Dumbbell series to a plot');
        chart.container('container');
        chart.draw();
    });
</script>
</body>
</html>
