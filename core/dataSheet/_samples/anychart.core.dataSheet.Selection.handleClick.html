<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.core.dataSheet.Selection.handleClick"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-data-sheet.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/data-sheet.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #title {
            font: 13px/1.4 Verdana, Helvetica, Arial, sans-serif;
            color: #212121;
            padding: 10px 12px 8px;
            box-sizing: border-box;
        }
        #container {
            width: 100%;
            height: calc(100% - 40px);
        }
    </style>
</head>
<body>
<div id="title"></div>
<div id="container"></div>
<script>
    anychart.onDocumentReady(function () {
        var data = [
            {id: 1, product: 'Laptop', category: 'Tech', price: 1200, stock: 34, status: 'In stock'},
            {id: 2, product: 'Chair', category: 'Office', price: 150, stock: 120, status: 'In stock'},
            {id: 3, product: 'Monitor', category: 'Tech', price: 300, stock: 58, status: 'In stock'},
            {id: 4, product: 'Desk', category: 'Office', price: 450, stock: 12, status: 'Low'},
            {id: 5, product: 'Keyboard', category: 'Tech', price: 80, stock: 240, status: 'In stock'},
            {id: 6, product: 'Lamp', category: 'Office', price: 45, stock: 0, status: 'Out of stock'}
        ];

        var grid = anychart.dataSheet(data);

        var selection = grid.selection();
        selection.mode('multi');

        // A row click goes through handleClick(). The second argument is the
        // Ctrl/Cmd flag, so this adds row 3 to the selection instead of replacing it.
        selection.handleClick(1, false);
        selection.handleClick(3, true);

        grid.container('container');
        grid.draw();

        document.getElementById('title').innerHTML = 'handleClick(1) then handleClick(3, ctrl) selected: ' + grid.selection().selectedIndices().join(", ");
    });
</script>
</body>
</html>
