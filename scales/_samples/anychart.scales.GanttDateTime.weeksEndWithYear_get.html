<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="anychart.scales.GanttDateTime.weeksEndWithYear get"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    <script src="https://cdn.anychart.com/releases/8.13.1/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.13.1/js/anychart-gantt.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.13.1/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.13.1/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/8.13.1/css/anychart-ui.min.css"/>
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
  anychart.onDocumentReady(function () {
    // get data
    var data = [
      {
        id: "1",
        name: "Development",
        actualStart: "2019-09-15",
        actualEnd: "2020-03-10",
        children: [
          {
            id: "1_1",
            name: "Analysis",
            actualStart: "2019-09-15",
            actualEnd: "2019-10-20"
          },
          {
            id: "1_2",
            name: "Design",
            actualStart: "2019-10-20",
            actualEnd: "2019-11-05"
          },
          {
            id: "1_3",
            name: "Meeting",
            actualStart: "2019-11-05",
            actualEnd: "2019-11-05"
          },
          {
            id: "1_4",
            name: "Implementation",
            actualStart: "2019-11-05",
            actualEnd: "2020-02-24"
          },
          {
            id: "1_5",
            name: "Testing",
            actualStart: "2020-02-25",
            actualEnd: "2020-03-10"
          }
        ]}
    ];

    // create a data tree
    var treeData = anychart.data.tree(data, "as-tree");
    
    // create a chart
    var chart = anychart.ganttProject();
    
    // set the data
    chart.data(treeData);

    // configure the scale
    var timeline = chart.getTimeline();
    var scale = timeline.scale();
    scale.zoomLevels([
    [
      {unit: "week", count: 1},
      {unit: "month", count: 1},
      {unit: "year", count: 1},
    ]
  ]);

    // get whether week intervals should align with year boundaries
    var isWeeksEndWithYear = scale.weeksEndWithYear();
    
    // set title text
    var text = "The weeks end with year setting is " + isWeeksEndWithYear;
    
    // set the title up 
    var title = chart.title();
    title.enabled(true);
    title.text(text);

    // set the container id
    chart.container("container");

    // initiate drawing the chart
    chart.draw();

    // fit elements to the width of the timeline
    chart.fitAll();

  });
</script>
</body>
</html>
